<style>

body{margin:0;line-height:inherit}

button,input,optgroup,select,textarea{font-family:inherit;font-size:100%;font-weight:inherit;line-height:inherit;color:inherit;margin:0;padding:0}
button,select{text-transform:none}
button,[type=button],[type=reset],[type=submit]{-webkit-appearance:button;background-image:none}
textarea{resize:vertical}
input::placeholder,textarea::placeholder{opacity:1;color:#9ca3af}
button,[role=button]{cursor:pointer}
:disabled{cursor:default}
[hidden]{display:none}
h1,h2,h3,h4,h5,h6{font-size:inherit;font-weight:inherit;margin:0}
a{color:inherit;text-decoration:inherit}
ol,ul,menu{list-style:none;margin:0;padding:0}
blockquote,dl,dd,hr,figure,p,pre{margin:0}
fieldset,legend{margin:0;padding:0}

/* ===== CSS Variables - Light Theme ===== */
:root,:root[data-theme="light"]{
  --bolt-elements-borderColor:#1717171a;
  --bolt-elements-borderColorActive:#1488FC;
  --bolt-elements-bg-depth-1:#FFFFFF;
  --bolt-elements-bg-depth-2:#FAFAFA;
  --bolt-elements-bg-depth-3:#E5E5E5;
  --bolt-elements-bg-depth-4:#1717170d;
  --bolt-elements-textPrimary:#0A0A0A;
  --bolt-elements-textSecondary:#525252;
  --bolt-elements-textTertiary:#737373;
  --bolt-elements-button-primary-background:#2BA6FF1a;
  --bolt-elements-button-primary-backgroundHover:#2BA6FF33;
  --bolt-elements-button-primary-text:#2BA6FF;
  --bolt-elements-item-contentDefault:#17171780;
  --bolt-elements-item-contentActive:#0A0A0A;
  --bolt-elements-item-contentAccent:#0D6FE8;

  --bolt-elements-messages-linkColor:#2BA6FF;
  --bolt-elements-prompt-background:#FFFFFFcc;
  --bolt-elements-sidebar-dropdownShadow:#1717171a;
  --bolt-elements-sidebar-buttonBackgroundDefault:#2BA6FF1a;
  --bolt-elements-sidebar-buttonBackgroundHover:#2BA6FF33;
  --bolt-elements-sidebar-buttonText:#0D6FE8;

}
:root[data-theme="dark"]{
  --bolt-elements-borderColor:#FFFFFF1a;
  --bolt-elements-bg-depth-1:#0A0A0A;
  --bolt-elements-bg-depth-2:#171717;
  --bolt-elements-bg-depth-3:#262626;
  --bolt-elements-textPrimary:#FFFFFF;
  --bolt-elements-textSecondary:#A3A3A3;
  --bolt-elements-textTertiary:#737373;
  --bolt-elements-item-contentDefault:#FFFFFF80;
  --bolt-elements-item-contentActive:#FFFFFF;
  --bolt-elements-item-contentAccent:#2BA6FF;
  --bolt-elements-item-backgroundActive:#FFFFFF1a;
  --bolt-elements-prompt-background:#171717cc;
  --bolt-elements-sidebar-buttonBackgroundDefault:#2BA6FF1a;
  --bolt-elements-sidebar-buttonBackgroundHover:#2BA6FF33;
  --bolt-elements-sidebar-buttonText:#2BA6FF;
}
:root{
  --header-height:54px;
  --chat-max-width:37rem;
  --chat-min-width:320px;
}
html,body{height:100%;width:100%}

/* ===== Layout ===== */
.w-full{width:100%}.h-full{height:100%}.flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.flex-grow{flex-grow:1}.items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}.overflow-scroll{overflow:scroll}.relative{position:relative}.fixed{position:fixed}.absolute{position:absolute}.sticky{position:sticky}.top-0{top:0}.inset-0{inset:0}.gap-2{gap:.5rem}.gap-1{gap:.25rem}.gap-4{gap:1rem}
.w-\[350px\]{width:350px}.h-\[var\(--header-height\)\]{height:var(--header-height)}.min-w-\[var\(--chat-min-width\)\]{min-width:var(--chat-min-width)}.max-w-chat{max-width:var(--chat-max-width)}.max-w-xl{max-width:36rem}

.text-bolt-elements-textPrimary{color:var(--bolt-elements-textPrimary)}.text-bolt-elements-textSecondary{color:var(--bolt-elements-textSecondary)}.text-bolt-elements-textTertiary{color:var(--bolt-elements-textTertiary)}.text-bolt-elements-sidebar-buttonText{color:var(--bolt-elements-sidebar-buttonText)}.text-bolt-elements-item-contentDefault{color:var(--bolt-elements-item-contentDefault)}.text-bolt-elements-item-contentAccent{color:var(--bolt-elements-item-contentAccent)}
.border-bolt-elements-borderColor{border-color:var(--bolt-elements-borderColor)}.border-transparent{border-color:transparent}
.text-accent{color:var(--bolt-elements-item-contentAccent)}
.placeholder-bolt-elements-textTertiary::placeholder{color:var(--bolt-elements-textTertiary)}

.border{border-width:1px}.border-b{border-bottom-width:1px}.border-t{border-top-width:1px}.border-r{border-right-width:1px}.border-none{border-style:none}.rounded-lg{border-radius:.5rem}.rounded-md{border-radius:.375rem}.rounded-full{border-radius:9999px}.rounded-r-3xl{border-top-right-radius:1.5rem;border-bottom-right-radius:1.5rem}

/* ===== Effects ===== */
.backdrop-filter{backdrop-filter:var(--un-backdrop-blur) var(--un-backdrop-brightness) var(--un-backdrop-contrast) var(--un-backdrop-grayscale) var(--un-backdrop-hue-rotate) var(--un-backdrop-invert) var(--un-backdrop-opacity) var(--un-backdrop-saturate) var(--un-backdrop-sepia)}.backdrop-blur-\[8px\]{--un-backdrop-blur:blur(8px);backdrop-filter:blur(8px)}.outline-none{outline:none}.resize-none{resize:none}.cursor-pointer{cursor:pointer}

.hover\:bg-bolt-elements-item-backgroundActive:hover{background-color:var(--bolt-elements-item-backgroundActive)}.hover\:bg-bolt-elements-sidebar-buttonBackgroundHover:hover{background-color:var(--bolt-elements-sidebar-buttonBackgroundHover)}.hover\:text-bolt-elements-textPrimary:hover{color:var(--bolt-elements-textPrimary)}.hover\:text-bolt-elements-item-contentActive:hover{color:var(--bolt-elements-item-contentActive)}.enabled\:hover\:bg-bolt-elements-item-backgroundActive:hover:enabled{background-color:var(--bolt-elements-item-backgroundActive)}.enabled\:hover\:text-bolt-elements-item-contentActive:hover:enabled{color:var(--bolt-elements-item-contentActive)}

/* ===== Special classes ===== */
.space-y-2>:not([hidden])~:not([hidden]){margin-top:.5rem}
.\[mask-image\:linear-gradient\(to_bottom\,black_0\%\,transparent_180\%\)\]{mask-image:linear-gradient(black 0%,transparent 180%)}
.hover\:\[mask-image\:none\]:hover{mask-image:none}
._ [data-chat-visible="true"]{display:flex}
.a{opacity:1}

/* ===== Sidebar transition ===== */
.side-menu{transition:left 0.3s ease,opacity 0.3s ease}

/* ===== LLM Modal ===== */
#llm-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center}
.modal-box{background:white;border-radius:16px;padding:24px;width:90%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
[data-theme="dark"] .modal-box{background:#171717;color:white}
.modal-input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:12px;font-size:14px;box-sizing:border-box;background:inherit;color:inherit}
[data-theme="dark"] .modal-input{border-color:#404040}
.modal-btn-save{padding:8px 18px;background:#2563eb;color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.modal-btn-cancel{padding:8px 18px;border:1px solid #e2e8f0;border-radius:8px;background:none;cursor:pointer;font-size:14px}
.modal-btn-clear{color:#ef4444;background:none;border:none;cursor:pointer;font-size:14px}
#llm-status{display:none;padding:10px 14px;background:#f0fdf4;border:1px solid #86efac;border-radius:8px;color:#16a34a;font-size:14px;font-weight:600;margin-bottom:12px}
</style>

<body>
<div id="root" class="w-full h-full">
  <div class="flex flex-col h-full w-full">

    <!-- Header -->
    <header class="flex items-center bg-bolt-elements-background-depth-1 p-5 border-b h-[var(--header-height)] border-transparent">
      <div class="flex items-center gap-2 z-logo text-bolt-elements-textPrimary cursor-pointer" onclick="toggleSidebar()">
        <div class="i-ph:sidebar-simple-duotone text-xl"></div>
        <a href="#" class="text-2xl font-semibold text-accent flex items-center" style="text-decoration:none">X Builder</a>
      </div>
      <span class="flex-1 px-4 truncate text-center text-bolt-elements-textPrimary" id="chat-title"></span>
    </header>

    <!-- Main -->
    <div class="_ relative flex h-full w-full overflow-hidden bg-bolt-elements-background-depth-1" data-chat-visible="true">

      <!-- Sidebar -->
      <div id="sidebar" class="flex flex-col side-menu fixed top-0 w-[350px] h-full bg-bolt-elements-background-depth-2 border-r rounded-r-3xl border-bolt-elements-borderColor z-sidebar shadow-xl" style="opacity:0;visibility:hidden;left:-150px">
        <div class="flex items-center h-[var(--header-height)]"></div>
        <div class="flex-1 flex flex-col h-full w-full overflow-hidden">
          <div class="p-4">
            <a href="#" onclick="newChat()" class="flex gap-2 items-center bg-bolt-elements-sidebar-buttonBackgroundDefault text-bolt-elements-sidebar-buttonText hover:bg-bolt-elements-sidebar-buttonBackgroundHover rounded-md p-2 transition-theme" style="text-decoration:none">
              <span class="inline-block i-bolt:chat" style="transform:scale(1.1)"></span>
              Начать новый чат
            </a>
          </div>
          <div class="text-bolt-elements-textPrimary font-medium pl-6 pr-5 my-2">Ваши чаты</div>
          <div class="flex-1 overflow-scroll pl-4 pr-5 pb-5" id="chat-history">
            <div class="pl-2 text-bolt-elements-textTertiary">Предыдущих разговоров не было.</div>
          </div>
          <div class="flex items-center justify-between border-t border-bolt-elements-borderColor p-4">
            <button onclick="document.getElementById('llm-modal').style.display='flex'" class="flex items-center gap-2 text-bolt-elements-textSecondary hover:text-bolt-elements-textPrimary transition-colors cursor-pointer" style="background:none;border:none">
              <div class="i-ph:gear text-xl"></div>
              <span class="text-sm">Настройки</span>
              <div id="status-dot" class="w-2 h-2 rounded-full bg-green-500" style="width:8px;height:8px;border-radius:50%;background:#9ca3af"></div>
            </button>
            <button onclick="toggleTheme()" class="flex items-center text-bolt-elements-item-contentDefault hover:text-bolt-elements-item-contentActive rounded-md p-1 hover:bg-bolt-elements-item-backgroundActive cursor-pointer" style="background:none;border:none">
              <div class="i-ph-moon-stars-duotone text-xl"></div>
            </button>
          </div>
        </div>
      </div>

      <!-- Chat area -->
      <div class="flex overflow-y-auto w-full h-full">
        <div class="a flex flex-col flex-grow min-w-
